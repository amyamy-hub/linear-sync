<!doctype html>
<meta charset="utf-8">
<title>linear-sync 鉴权自检</title>
<style>body{font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:38em;margin:3em auto;padding:0 1.2em}code{background:#f2f2f2;padding:.1em .35em;border-radius:4px}small{color:#666}</style>

<h2>这个页在做什么</h2>
<p>它会自动向 <code>POST /sync</code> 发一发<strong>不带密码</strong>的请求。</p>
<p>✅ 屏幕上出现 <code>{ "error": "unauthorized" }</code> ⇒ 锁生效，闲人写不进去。<br>❌ 屏幕上出现 <code>{ "ok": true, ... }</code> ⇒ 锁没生效，告诉我。</p>
<p><small>⚠️ 诚实声明：若锁没生效，这一发会触发一次<strong>真实同步</strong>（不是 dryRun，因为表单发不出 JSON）。它做的是按 Linear ID 去重更新，作害面是“多刷一次”，不会造重复页。</small></p>
<p><small>用完删：仓库里 <code>tools/sync-auth-check.html</code> 一个文件，或直按这个页删。</small></p>

<form id="f" method="POST" action="https://linear-sync.amy4399666.workers.dev/sync">
<input type="hidden" name="probe" value="no-auth">
<button type="submit">没自动跳转就点我</button>
</form>

<script>document.getElementById('f').submit();</script>
